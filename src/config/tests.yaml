# Physical Therapy Test Presets
# Each test defines a preset configuration that controls which measurements are available.
#
# Fields:
#   key:                     URL-friendly identifier for routing
#   name:                    Display name shown in the UI
#   permitted_measurements:  List of measurement group keys that are allowed.
#                            If omitted or null, ALL measurements are available.

- key: measurements
  name: "Measurements"
  # All measurements permitted (no restriction)

- key: annualMobilityScreening
  name: "Annual Mobility Screening"
  permitted_measurements:
    - vitalSigns
    - fiveMeterUsualWalkingSpeed
    - fiveMeterFastWalkingSpeed
    - thirtySecondSitToStand
    - assistiveDevices
    - fourSquareStepTest
    - modifiedFourSquareStepTest
    - timedUpAndGo
    - timedUpAndGoCognitive
