# Threshold tables for PCML / ML mobility classifications.
# Structure: table_name → compare_as + classifications + <sex> → <age_bracket> → { no_pcml, pcml, ml, mean, sd }.
#
# compare_as:
#   higher_is_better - e.g. walking speed. no_pcml uses >=, pcml/ml use <=.
#   lower_is_better  - e.g. completion time. no_pcml uses <=, pcml/ml use >=.
#
# classifications: label + severity (concern/caution/normal/info) for each of no_pcml, pcml, ml.
# Age brackets: 50-59, 60-69, 70-79, 80-89, 90+.

usual_walking_speed:
  compare_as: "higher_is_better"
  classifications:
    no_pcml:
      label: "No Preclinical Mobility Limitation (No PCML)"
      severity: normal
    pcml:
      label: "Preclinical Mobility Limitation (PCML)"
      severity: caution
    ml:
      label: "Mobility Limitation (ML)"
      severity: concern
  Male:
    "50-59": { no_pcml: 1.23, pcml: 1.22, ml: 1.15, mean: 1.31, sd: 0.16 }
    "60-69": { no_pcml: 1.19, pcml: 1.18, ml: 1.10, mean: 1.27, sd: 0.71 }
    "70-79": { no_pcml: 1.09, pcml: 1.08, ml: 0.98, mean: 1.18, sd: 0.20 }
    "80-89": { no_pcml: 0.93, pcml: 0.92, ml: 0.82, mean: 1.02, sd: 0.20 }
    "90+":   { no_pcml: 0.83, pcml: 0.82, ml: 0.74, mean: 0.91, sd: 0.17 }
  Female:
    "50-59": { no_pcml: 1.18, pcml: 1.17, ml: 1.09, mean: 1.26, sd: 0.17 }
    "60-69": { no_pcml: 1.15, pcml: 1.14, ml: 1.06, mean: 1.22, sd: 0.16 }
    "70-79": { no_pcml: 1.03, pcml: 1.02, ml: 0.92, mean: 1.12, sd: 0.20 }
    "80-89": { no_pcml: 0.89, pcml: 0.88, ml: 0.77, mean: 0.98, sd: 0.21 }
    "90+":   { no_pcml: 0.66, pcml: 0.65, ml: 0.55, mean: 0.76, sd: 0.21 }

